name: secret-scan

# Scans the whole git history for secrets with gitleaks (scripts/secret-scan.sh, image pinned by digest).
# A prerequisite for making the repository public; it keeps running after that.

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  # The release workflow runs it first, on the tag it releases.
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # every branch and tag, so the scan covers the whole history
          fetch-depth: 0
      - run: scripts/secret-scan.sh
