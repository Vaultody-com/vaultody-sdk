name: test

# Runs every package's tests, including every case in test-vectors/, on each push and pull request, and
# the checks that keep the SDKs in step: coverage against the published OpenAPI document, one runner per
# vector set, and the generated vectors unchanged.
#
# Actions are pinned to full commit SHAs: this repository ships code that decides whether a client trusts
# a response, so a moved tag must not be able to change what runs here. No job uses a secret.

on:
  push:
  pull_request:
  # The release workflow runs all of this first, on the tag it releases.
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # No dependencies outside the repository: this only links the two workspace packages.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  python:
    runs-on: ubuntu-latest
    # The official Python images, so every supported version runs whatever the runner image ships.
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python -m pip install -e './python/vaultody-verify[requests]' -e ./python/vaultody-sdk pytest
      - run: python -m pytest -q
        working-directory: python/vaultody-verify
      - run: python -m pytest -q
        working-directory: python/vaultody-sdk

  # The public API as an application types it: mypy --strict over python/vaultody-sdk/tests/typecheck/
  # against the installed package (its py.typed annotations), on the oldest and the newest Python.
  python-types:
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.15']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python -m pip install ./python/vaultody-verify ./python/vaultody-sdk mypy==2.4.1
      - run: python -m mypy --strict python/vaultody-sdk/tests/typecheck/

  php:
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint
        run: find php -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php php/tests/run.php

  php-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # composer as the runner image ships it; validate reads composer.json only
      - run: composer validate --strict --no-check-publish --working-dir=php

  # The pin file across languages (docs/vault-keys-file.md): a file written by each SDK is read the same by the
  # other two, all three write the same bytes, and writers in all three languages share one file at once.
  vault-keys-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # The Node helper loads @vaultody/sdk, which needs @vaultody/verify linked (as in the node job).
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: node
      - name: Python with both packages; PHP as the runner image ships it
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./python/vaultody-verify ./python/vaultody-sdk
          php --version
      - run: node conformance/interop/run.mjs
        env:
          VAULTODY_INTEROP_PYTHON: ${{ runner.temp }}/venv/bin/python

  # Every documented operation has exactly one method in every SDK, with the documented HTTP method, path
  # and parameters (enforced: nothing may be missing), and every vector set has its runners.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Coverage check tests
        run: node --test scripts/coverage.test.mjs
      - name: Version and release guard tests
        run: node --test scripts/version.test.mjs scripts/release/guard.test.mjs
      # The Node surface is read from a real client, which needs @vaultody/verify linked (as in the node job).
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: node
      - name: Surface of each SDK
        run: |
          node node/packages/sdk/scripts/surface.js > "$RUNNER_TEMP/node.json"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ./python/vaultody-verify ./python/vaultody-sdk
          "$RUNNER_TEMP/venv/bin/python" -I -m vaultody_sdk._surface > "$RUNNER_TEMP/python.json"
          php php/bin/surface.php > "$RUNNER_TEMP/php.json"
      - name: Coverage against contract/openapi.json
        run: node scripts/coverage.mjs --surface "$RUNNER_TEMP/node.json" --surface "$RUNNER_TEMP/python.json" --surface "$RUNNER_TEMP/php.json"
      - name: Every vector set has its runners
        run: node scripts/check-vectors.mjs
      - name: The SDK vectors are what their generator writes
        run: node test-vectors/tools/generate-sdk-vectors.js --check
