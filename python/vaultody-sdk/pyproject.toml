[build-system]
# 77 is the first setuptools that reads license as an SPDX expression and license-files (PEP 639); it
# also supports editable installs from pyproject.toml alone.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultody-sdk"
version = "0.1.0"
description = "The official Vaultody SDK for Python: sync and async clients that sign requests, verify responses and check returned addresses."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# vaultody-verify is pinned to the one version number of the repository; httpx carries the sync and the
# async client.
dependencies = ["vaultody-verify==0.1.0", "cryptography>=3.1", "httpx>=0.27"]
classifiers = [
    # Makes PyPI refuse an accidental upload until the first release: the version pull request of the
    # first release candidate removes it (scripts/release/guard.mjs refuses a release that still has it).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
packages = ["vaultody_sdk"]

[tool.setuptools.package-data]
# The package is typed (models.py, the API methods): type checkers read its annotations.
vaultody_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
