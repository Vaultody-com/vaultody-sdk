[build-system]
# 77 is the first setuptools that reads license as an SPDX expression and license-files (PEP 639); it
# also supports editable installs from pyproject.toml alone.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultody-verify"
version = "0.1.0"
description = "Verify that Vaultody API responses are signed by the Vaultody API gateway and unchanged."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 3.1 is the first release where every call used here works without a backend argument; Ed25519 and
# DER-encoded ECDSA P-256 verification are older than that.
dependencies = ["cryptography>=3.1"]
classifiers = [
    # Makes PyPI refuse an accidental upload until the first release: the version pull request of the
    # first release candidate removes it (scripts/release/guard.mjs refuses a release that still has it).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
requests = ["requests>=2.20"]

[tool.setuptools]
packages = ["vaultody_verify", "vaultody_verify.address", "vaultody_verify.address.crypto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
